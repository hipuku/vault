# Electron ships a Chromium and a Node to the user's machine, so a stale version is a
# security question rather than housekeeping. Weekly, grouped, so it is one review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      electron:
        patterns: ['electron', 'electron-*', '@electron/*', '@electron-toolkit/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*', 'vite', 'vitest', '@vitejs/*']
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
