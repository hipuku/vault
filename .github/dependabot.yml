# Electron ships a Chromium and a Node to the user's machine, so a stale version is a
# security question rather than housekeeping. Weekly, grouped, so it is one review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Vite's usable major is set by electron-vite's peer range, not by anything in
      # this repo, so it moves with Electron rather than with the linters. Grouped the
      # other way, one unsatisfiable Vite major blocks every lint and test bump too.
      electron:
        patterns: ['electron', 'electron-*', '@electron/*', '@electron-toolkit/*', 'vite', '@vitejs/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      # The test runner and its environments are their own group. Grouped with the
      # linters, one vitest major holds an eslint patch hostage.
      test:
        patterns: ['vitest', '@vitest/*', 'jsdom', 'happy-dom', '@testing-library/*']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*']
    commit-message:
      prefix: 'deps'
    ignore:
      # @types/node describes the runtime, so it tracks the Node that Electron ships
      # and that CI installs, currently 22, rather than the newest release line.
      # Taking a major here type-checks the app against APIs the binary does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is the native rewrite, deferred across every repo here so they
      # move together. Recorded rather than closed: a closed pull request comes back
      # on the next run and says nothing about why it was refused.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # vite 8 and @vitejs/plugin-react 6 need each other and neither works here
      # yet. plugin-react 6 peers vite ^8 alone, and electron-vite 5, which is
      # latest, peers ^5 || ^6 || ^7, so the two halves of that upgrade want
      # different vite majors and no combination installs. electron-vite
      # 6.0.0-beta.1 peers ^6 || ^7 || ^8; when it ships stable these two rules
      # come out and both bumps land in one commit.
      #
      # Scoped to the versions that cannot work rather than to semver-major, so
      # anything below the ceiling still arrives as a pull request.
      - dependency-name: 'vite'
        versions: ['>=8']
      - dependency-name: '@vitejs/plugin-react'
        versions: ['>=6']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
