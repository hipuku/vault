name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and release .dmg
    runs-on: macos-latest
    # The default GITHUB_TOKEN is read-only; creating a Release needs write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Unsigned build — Vault ships as a direct download, not via the App Store.
      # CSC_IDENTITY_AUTO_DISCOVERY=false makes the build deterministic (no attempt
      # to find a signing identity on the runner). The app keeps Electron's ad-hoc
      # signature, so it launches on Apple Silicon after the user clears quarantine
      # (see README → Install). To ship signed + notarised later: add an Apple
      # Developer cert as CSC_LINK/CSC_KEY_PASSWORD + APPLE_ID/APPLE_APP_SPECIFIC_
      # PASSWORD/APPLE_TEAM_ID secrets, and remove the env override below.
      # `--publish never`: electron-builder only builds the DMGs into dist/. On a
      # tag it would otherwise try to publish to GitHub itself and fail without a
      # token — publishing is the dedicated softprops step below.
      - name: Build unsigned .dmg (arm64 + x64)
        run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.dmg
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
