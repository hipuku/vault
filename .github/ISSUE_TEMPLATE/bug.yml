name: Bug
description: Vault does something it should not, or does not do something it should.
labels: [fix]
body:
  - type: textarea
    id: expected
    attributes:
      label: What it should do, and what it does
      description: The line in README or FEATURE it contradicts, if there is one.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to see it
      description: Steps from a fresh launch. A screenshot or recording helps.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Vault version
      description: From the release you downloaded, or the commit if you built it.
      placeholder: v0.3.1
    validations: { required: true }
  - type: input
    id: platform
    attributes:
      label: macOS version and chip
      placeholder: macOS 26.1, Apple Silicon
    validations: { required: true }
